  <script type="text/babel" data-presets="react">

const{useState,useRef}=React;
const C={navy:"#1A2340",navy2:"#222B45",red:"#E03A2F",yellow:"#F5C518",blue:"#4AB8D8",green:"#5DBB63",white:"#FFFFFF",gray:"#2D3655",lightgray:"#3A4468",orange:"#F5832A"};
const COLEGIOS=["The Grange School","Nido de Águilas","The Mackay School","Colegio de Los Andes","Colegio Tabancura","Colegio Everest","Colegio Hebreo","Colegio Manquecura","Colegio Monte de Asís","Colegio Sagrada Familia","Colegio San Francisco de Sales","Colegio Santa María","Colegio La Maisonnette","Colegio San Ignacio El Bosque","Colegio Craighouse","Saint John's School","Colegio Los Nogales","Colegio Santa Úrsula","Colegio Teresiano","The British School","Colegio Alianza Francesa","Colegio Rochester","Colegio Alemán","Colegio Japonés","Colegio Árabe","Colegio Fontanar","Colegio San Esteban Mártir","Colegio Montedónico","Colegio Dunalastair","Colegio Highlands","Colegio Villa María","Colegio Carlos Casanueva","Colegio Bicentenario","Instituto Alonso de Ercilla"];
const CATS=[{id:"uniforme",label:"Uniformes",emoji:"👕",color:C.yellow,light:"rgba(245,197,24,0.15)"},{id:"deportivo",label:"Deportivo",emoji:"🏃",color:C.blue,light:"rgba(74,184,216,0.15)"},{id:"libros",label:"Libros",emoji:"📚",color:C.blue,light:"rgba(74,184,216,0.15)"},{id:"utiles",label:"Útiles",emoji:"✏️",color:C.red,light:"rgba(224,58,47,0.15)"},{id:"disfraz",label:"Disfraces",emoji:"🎭",color:C.green,light:"rgba(93,187,99,0.15)"}];
const ARTICULOS={uniforme:["Camisa blanca manga corta","Camisa blanca manga larga","Blusa blanca","Pantalón gris","Falda azul marino","Falda cuadriculada","Corbata / lazo","Suéter / jersey","Conjunto completo niño","Conjunto completo niña"],deportivo:["Short deportivo","Camiseta deportiva","Pants / buzo","Medias deportivas","Conjunto deportivo completo","Chaqueta deportiva"],libros:["Libro de Matemáticas","Libro de Lenguaje","Libro de Ciencias","Libro de Historia","Libro de Inglés","Set completo de libros","Diccionario"],utiles:["Mochila escolar","Lonchera","Estuche / cartuchera","Kit de geometría","Colores / crayolas","Marcadores","Calculadora","Set de útiles completo"],disfraz:["Disfraz de animal","Disfraz de superhéroe","Disfraz histórico","Disfraz de princesa/príncipe","Disfraz de profesión","Disfraz patrio","Disfraz completo con accesorios"]};
const TALLAS=["Talla 4","Talla 6","Talla 8","Talla 10","Talla 12","Talla 14","XS","S","M","L","XL","No aplica"];
const ESTADOS=[{id:"nuevo",label:"Nuevo sin uso",emoji:"✨",color:C.green},{id:"como_nuevo",label:"Usado — como nuevo",emoji:"⭐",color:C.blue},{id:"leve",label:"Usado — signos leves de uso",emoji:"👍",color:C.yellow},{id:"prolongado",label:"Usado — uso prolongado",emoji:"👌",color:C.orange}];
const getEstado=id=>ESTADOS.find(e=>e.id===id)||ESTADOS[1];
const COMM=0.20,WALLET_DAYS=7;
const genId=()=>Math.random().toString(36).slice(2,9);
const fmt=p=>p===0?"Donación 🎁":`$${p.toLocaleString("es-CL")}`;
const getCat=id=>CATS.find(c=>c.id===id)||CATS[0];
const getUser=(id,users)=>users.find(u=>u.id===id);
const sellerScore=(userId,reviews)=>{const r=reviews.filter(r=>r.vendedorId===userId);if(!r.length)return null;return r.reduce((s,x)=>s+x.stars,0)/r.length;};
const scoreBadge=s=>{if(!s)return{label:"Sin calificaciones",color:C.gray};if(s>=4.5)return{label:"⭐ Vendedor Destacado",color:C.green};if(s>=3.5)return{label:"👍 Buen vendedor",color:C.blue};if(s>=2.5)return{label:"⚠️ En observación",color:C.orange};if(s>=2)return{label:"⚠️ Advertencia",color:C.orange};return{label:"🚫 Suspendido",color:C.red};};
const SEED_USERS=[{id:"u1",nombre:"María González",email:"maria@mail.com",password:"1234",colegio:"The Grange School",avatar:"👩",joinDate:"Enero 2025",walletBalance:0,walletPending:[],role:"user",suspended:false},{id:"u2",nombre:"Carlos Mora",email:"carlos@mail.com",password:"1234",colegio:"Nido de Águilas",avatar:"👨",joinDate:"Febrero 2025",walletBalance:4160,walletPending:[],role:"user",suspended:false},{id:"u3",nombre:"Sofía Vargas",email:"sofia@mail.com",password:"1234",colegio:"Colegio Tabancura",avatar:"👩‍🦱",joinDate:"Marzo 2025",walletBalance:0,walletPending:[{amount:3600,releaseDate:"2025-05-10",orderId:"o1"}],role:"user",suspended:false},{id:"admin",nombre:"Admin SchoolBag",email:"admin@schoolbag.cl",password:"admin123",colegio:"-",avatar:"🛡️",joinDate:"2024",walletBalance:0,walletPending:[],role:"admin",suspended:false}];
const SEED_REVIEWS=[{id:"r1",vendedorId:"u1",compradorId:"u2",orderId:"o0",stars:5,comment:"¡Artículo en perfectas condiciones!",fecha:"2025-03-15"},{id:"r2",vendedorId:"u1",compradorId:"u3",orderId:"o00",stars:4,comment:"Muy buena vendedora, entrega rápida.",fecha:"2025-04-02"},{id:"r3",vendedorId:"u2",compradorId:"u1",orderId:"o000",stars:3,comment:"El estado era un poco peor de lo esperado.",fecha:"2025-04-10"}];
const SEED_ORDERS=[{id:"o0",compradorId:"u2",vendedorId:"u1",productId:"p1",monto:8500,fecha:"2025-03-14",reviewed:true},{id:"o00",compradorId:"u3",vendedorId:"u1",productId:"p2",monto:5200,fecha:"2025-04-01",reviewed:true},{id:"o000",compradorId:"u1",vendedorId:"u2",productId:"p3",monto:3800,fecha:"2025-04-09",reviewed:true}];
const SEED_PRODUCTS=[{id:"p1",vendedorId:"u1",categoria:"uniforme",articulo:"Conjunto completo niña",descripcion:"Falda azul marino y blusa blanca, lavadas, impecables.",talla:"Talla 10",estado:"como_nuevo",tipo:"Venta",precio:8500,colegio:"The Grange School",fotos:["https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=400&q=80"],status:"approved"},{id:"p2",vendedorId:"u1",categoria:"libros",articulo:"Set completo de libros",descripcion:"Sin rayar, solo primeros capítulos usados.",talla:"No aplica",estado:"leve",tipo:"Venta",precio:5200,colegio:"The Grange School",fotos:["https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?w=400&q=80"],status:"approved"},{id:"p3",vendedorId:"u2",categoria:"deportivo",articulo:"Conjunto deportivo completo",descripcion:"Usado una temporada, elástico en buen estado.",talla:"Talla 12",estado:"leve",tipo:"Venta",precio:3800,colegio:"Nido de Águilas",fotos:["https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&q=80"],status:"approved"},{id:"p4",vendedorId:"u3",categoria:"disfraz",articulo:"Disfraz completo astronauta",descripcion:"Casco y guantes incluidos, perfecto estado.",talla:"Talla 8",estado:"como_nuevo",tipo:"Donación",precio:0,colegio:"Colegio Tabancura",fotos:["https://images.unsplash.com/photo-1608889175638-9322300c369e?w=400&q=80"],status:"approved"},{id:"p5",vendedorId:"u2",categoria:"utiles",articulo:"Kit de geometría",descripcion:"Regla, compás, transportador. Todo en su funda original.",talla:"No aplica",estado:"nuevo",tipo:"Venta",precio:2200,colegio:"Nido de Águilas",fotos:["https://images.unsplash.com/photo-1456406644174-8ddd4cd52a06?w=400&q=80"],status:"approved"},{id:"p6",vendedorId:"u3",categoria:"uniforme",articulo:"Pantalón gris",descripcion:"Tela de buena calidad, sin manchas ni roturas.",talla:"Talla 14",estado:"prolongado",tipo:"Venta",precio:4500,colegio:"Colegio Tabancura",fotos:["https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=400&q=80"],status:"pending"}];
const inp={width:"100%",padding:"12px 16px",borderRadius:14,border:"1.5px solid rgba(255,255,255,0.12)",fontSize:14,boxSizing:"border-box",outline:"none",background:"rgba(255,255,255,0.08)",color:"white",fontFamily:"inherit"};
const lbl={display:"block",fontSize:11,fontWeight:800,color:"rgba(255,255,255,0.55)",textTransform:"uppercase",letterSpacing:1,marginBottom:6};
const btnP=(col=C.red)=>({background:col,color:col===C.yellow?C.navy:"white",border:"none",borderRadius:50,padding:"13px 28px",fontWeight:800,cursor:"pointer",fontSize:15,fontFamily:"inherit"});
function Toast({msg}){return msg?<div style={{position:"fixed",top:22,right:22,background:C.yellow,color:C.navy,padding:"13px 24px",borderRadius:50,fontWeight:800,zIndex:9999,boxShadow:"0 8px 32px rgba(245,197,24,.4)",fontSize:14}}>{msg}</div>:null;}
function Ava({user,size=38}){const cols=[C.red,C.blue,C.green,C.yellow,"#9B59B6"];const i=user?user.id.charCodeAt(1)%cols.length:0;return <div style={{width:size,height:size,borderRadius:"50%",background:cols[i],display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.42,flexShrink:0,border:"2.5px solid rgba(255,255,255,0.2)"}}>{user?.avatar||"👤"}</div>;}
function Overlay({onClose,children,maxW=520}){return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(10,15,35,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16,backdropFilter:"blur(6px)"}}><div onClick={e=>e.stopPropagation()} style={{background:C.navy2,borderRadius:28,maxWidth:maxW,width:"100%",maxHeight:"93vh",overflowY:"auto",boxShadow:"0 32px 80px rgba(0,0,0,.6)",border:"1px solid rgba(255,255,255,0.08)"}}>{children}</div></div>);}
function Stars({value,onChange,size=22}){const[hover,setHover]=useState(0);return(<div style={{display:"flex",gap:4}}>{[1,2,3,4,5].map(s=>(<span key={s} onClick={()=>onChange&&onChange(s)} onMouseEnter={()=>onChange&&setHover(s)} onMouseLeave={()=>onChange&&setHover(0)} style={{fontSize:size,cursor:onChange?"pointer":"default",color:(hover||value)>=s?C.yellow:"rgba(255,255,255,0.2)",transition:"color .1s"}}>★</span>))}</div>);}
function ScorePill({score}){if(!score)return <span style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>Sin calificaciones</span>;const b=scoreBadge(score);return <span style={{background:`${b.color}22`,color:b.color,fontSize:12,fontWeight:800,padding:"4px 12px",borderRadius:50,border:`1px solid ${b.color}44`}}>{b.label} ({score.toFixed(1)})</span>;}
function EstadoBadge({estadoId}){const e=getEstado(estadoId);return <span style={{background:`${e.color}22`,color:e.color,fontSize:11,fontWeight:800,padding:"3px 11px",borderRadius:50,border:`1px solid ${e.color}33`}}>{e.emoji} {e.label}</span>;}
function PhotoUploader({fotos,setFotos}){const ref=useRef();const add=e=>{const files=[...e.target.files];if(fotos.length+files.length>2){alert("Máximo 2 fotos");return;}files.forEach(f=>{const r=new FileReader();r.onload=ev=>setFotos(p=>[...p,ev.target.result]);r.readAsDataURL(f);});};return(<div><label style={lbl}>Fotos (máx. 2) *</label><div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>{fotos.map((f,i)=>(<div key={i} style={{position:"relative",width:88,height:88}}><img src={f} alt="" style={{width:88,height:88,objectFit:"cover",borderRadius:14,border:"2px solid rgba(255,255,255,0.2)"}}/><button onClick={()=>setFotos(p=>p.filter((_,j)=>j!==i))} style={{position:"absolute",top:-6,right:-6,background:C.red,color:"white",border:"none",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button></div>))}{fotos.length<2&&(<div onClick={()=>ref.current.click()} style={{width:88,height:88,border:`2px dashed ${C.blue}`,borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",background:"rgba(74,184,216,0.1)",color:C.blue,fontSize:11,fontWeight:800,gap:4}}><span style={{fontSize:22}}>📷</span><span>Agregar</span></div>)}</div><input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={add}/><p style={{fontSize:11,color:"rgba(255,255,255,0.3)",margin:"8px 0 0"}}>Revisadas en 24-48h antes de publicarse</p></div>);}
function ReviewModal({order,vendedor,onClose,onSubmit}){const[stars,setStars]=useState(0);const[comment,setComment]=useState("");const valid=stars>0;const info=stars===1?"⚠️ Esta calificación iniciará un ticket de soporte.":stars===2?"⚠️ Esta calificación generará una advertencia al vendedor.":"";return(<Overlay onClose={onClose} maxW={440}><div style={{padding:"28px 28px 32px"}}><div style={{textAlign:"center",marginBottom:22}}><div style={{fontSize:40,marginBottom:8}}>⭐</div><h2 style={{color:"white",fontWeight:900,margin:"0 0 4px",fontSize:20}}>Califica tu compra</h2><div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginTop:10}}><Ava user={vendedor} size={32}/><span style={{color:"rgba(255,255,255,0.7)",fontSize:14}}>{vendedor?.nombre}</span></div></div><div style={{background:C.gray,borderRadius:16,padding:"16px",marginBottom:16,textAlign:"center"}}><div style={{color:"rgba(255,255,255,0.55)",fontSize:13,marginBottom:10}}>¿Cómo fue tu experiencia?</div><div style={{display:"flex",justifyContent:"center",marginBottom:8}}><Stars value={stars} onChange={setStars} size={36}/></div>{stars>0&&<div style={{fontSize:13,fontWeight:800,color:[C.red,C.orange,C.yellow,C.blue,C.green][stars-1]}}>{["😤 Muy mala","😕 Mala","😐 Regular","😊 Buena","🤩 Excelente"][stars-1]}</div>}</div>{info&&<div style={{background:"rgba(245,131,42,0.12)",border:`1px solid ${C.orange}44`,borderRadius:12,padding:"10px 14px",fontSize:12,color:C.orange,marginBottom:14}}>{info}</div>}<div style={{marginBottom:18}}><label style={lbl}>Comentario (opcional)</label><textarea value={comment} onChange={e=>setComment(e.target.value)} placeholder="Cuéntale a otros compradores..." rows={3} style={{...inp,resize:"vertical"}}/></div><div style={{display:"flex",gap:10}}><button onClick={onClose} style={{padding:"12px 20px",background:C.gray,border:"none",borderRadius:50,cursor:"pointer",fontSize:14,color:"rgba(255,255,255,0.6)",fontFamily:"inherit"}}>Cancelar</button><button onClick={()=>valid&&onSubmit(stars,comment)} style={{...btnP(C.yellow),flex:1,opacity:valid?1:.4,cursor:valid?"pointer":"not-allowed",textAlign:"center"}}>Enviar calificación</button></div></div></Overlay>);}
function WalletPanel({user,onClose}){const totalPending=user.walletPending?.reduce((s,p)=>s+p.amount,0)||0;const today=new Date();const daysLeft=p=>Math.max(0,Math.ceil((new Date(p.releaseDate)-today)/(1000*60*60*24)));return(<Overlay onClose={onClose} maxW={440}><div style={{padding:"28px 28px 32px"}}><div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:44,marginBottom:6}}>💰</div><h2 style={{color:"white",fontWeight:900,margin:"0 0 4px",fontSize:22}}>Mi Billetera SchoolBag</h2><p style={{color:"rgba(255,255,255,0.45)",fontSize:13,margin:0}}>Tus ganancias de ventas</p></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}><div style={{background:`${C.green}22`,border:`1px solid ${C.green}44`,borderRadius:18,padding:"18px 16px",textAlign:"center"}}><div style={{fontSize:12,color:C.green,fontWeight:800,marginBottom:6}}>DISPONIBLE</div><div style={{fontSize:26,fontWeight:900,color:C.green}}>{fmt(user.walletBalance)}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:4}}>Listo para retirar</div></div><div style={{background:`${C.yellow}22`,border:`1px solid ${C.yellow}44`,borderRadius:18,padding:"18px 16px",textAlign:"center"}}><div style={{fontSize:12,color:C.yellow,fontWeight:800,marginBottom:6}}>EN PROCESO</div><div style={{fontSize:26,fontWeight:900,color:C.yellow}}>{fmt(totalPending)}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginTop:4}}>Se libera en {WALLET_DAYS} días</div></div></div>{user.walletPending?.length>0&&(<div style={{marginBottom:20}}><div style={{fontSize:11,fontWeight:800,color:"rgba(255,255,255,0.45)",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Pagos pendientes</div>{user.walletPending.map((p,i)=>(<div key={i} style={{background:C.gray,borderRadius:14,padding:"12px 16px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{color:"white",fontWeight:800,fontSize:14}}>{fmt(p.amount)}</div><div style={{fontSize:12,color:"rgba(255,255,255,0.45)"}}>Orden #{p.orderId}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:12,color:C.yellow,fontWeight:700}}>⏳ {daysLeft(p)} días</div><div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>Se libera {p.releaseDate}</div></div></div>))}</div>)}<div style={{background:"rgba(74,184,216,0.1)",border:`1px solid ${C.blue}33`,borderRadius:14,padding:"12px 16px",fontSize:12,color:C.blue,marginBottom:20}}>💡 El 80% de cada venta ingresa como "en proceso". A los {WALLET_DAYS} días se libera para retirar.</div>{user.walletBalance>0&&<button style={{...btnP(C.green),width:"100%",textAlign:"center",fontSize:15,marginBottom:10}}>Retirar {fmt(user.walletBalance)} →</button>}<button onClick={onClose} style={{width:"100%",padding:"11px",background:"transparent",border:"1px solid rgba(255,255,255,0.12)",borderRadius:50,color:"rgba(255,255,255,0.5)",cursor:"pointer",fontSize:14,fontFamily:"inherit"}}>Cerrar</button></div></Overlay>);}
function PCard({product,users,reviews,onView,onCart,inCart,featured}){const cat=getCat(product.categoria);const seller=getUser(product.vendedorId,users);const score=sellerScore(product.vendedorId,reviews);const isD=product.tipo==="Donación";return(<div style={{background:C.navy2,borderRadius:22,overflow:"hidden",cursor:"pointer",border:`1px solid ${featured?"rgba(245,197,24,0.4)":"rgba(255,255,255,0.08)"}`,transition:"transform .2s,box-shadow .2s",display:"flex",flexDirection:"column",position:"relative"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-6px)";e.currentTarget.style.boxShadow="0 20px 50px rgba(0,0,0,.5)";}} onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>{featured&&<div style={{position:"absolute",top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,${C.yellow},${C.orange})`}}/>}<div onClick={()=>onView(product)} style={{height:155,overflow:"hidden",position:"relative",background:cat.light,display:"flex",alignItems:"center",justifyContent:"center"}}>{product.fotos?.[0]?<img src={product.fotos[0]} alt={product.articulo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:52}}>{cat.emoji}</span>}<div style={{position:"absolute",top:10,left:10}}><span style={{background:isD?C.green:C.red,color:"white",fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:50}}>{isD?"🎁 Donación":"💰 Venta"}</span>{featured&&<span style={{marginLeft:5,background:C.yellow,color:C.navy,fontSize:10,fontWeight:800,padding:"3px 10px",borderRadius:50}}>⭐ Destacado</span>}</div></div><div onClick={()=>onView(product)} style={{padding:"12px 14px",flex:1,display:"flex",flexDirection:"column",gap:4}}><div style={{fontWeight:800,fontSize:13.5,color:"white",lineHeight:1.3}}>{product.articulo}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.45)"}}>🏫 {product.colegio.replace("Colegio ","").replace("The ","")}</div><EstadoBadge estadoId={product.estado}/>{score&&<div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}><span style={{color:C.yellow,fontSize:12}}>★</span><span style={{fontSize:11,color:"rgba(255,255,255,0.55)"}}>{score.toFixed(1)} · {seller?.nombre.split(" ")[0]}</span></div>}</div><div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.07)",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontWeight:900,fontSize:18,color:isD?C.green:C.yellow}}>{fmt(product.precio)}</span>{!isD&&<button onClick={e=>{e.stopPropagation();onCart(product);}} style={{background:inCart?C.green:C.red,color:"white",border:"none",borderRadius:50,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:800}}>{inCart?"✓ Agregado":"🛍️ Agregar"}</button>}</div></div>);}

  const[payData,setPayData]=useState(null);

  const[cart,setCart]=useState([]);
  const[toast,setToast]=useState(null);

  const[filterTipo,setFTipo]=useState("all");
  const showT=m=>{setToast(m);setTimeout(()=>setToast(null),3200);};
  const addCart=p=>{if(cart.includes(p.id)){showT("Ya está en tu SchoolBag");return;}setCart(c=>[...c,p.id]);showT("🛍️ Agregado a tu SchoolBag");};
  const removeCart=id=>setCart(c=>c.filter(x=>x!==id));
  const openChat=seller=>{if(!me){setShowAuth(true);return;}const k=[me.id,seller.id].sort().join("-");if(!chats[k])setChats(p=>({...p,[k]:[]}));setChatOpen(true);};
  const handleLogin=(email,pw)=>{const u=users.find(u=>u.email===email&&u.password===pw);if(u){if(u.suspended){showT("⛔ Tu cuenta fue suspendida.");return;}setMe(u);setShowAuth(false);if(u.role==="admin")setShowAdmin(true);else{setView("home");showT(`✅ ¡Bienvenida, ${u.nombre.split(" ")[0]}!`);}}else showT("❌ Correo o contraseña incorrectos");};
  const handleRegister=form=>{if(!form.nombre||!form.email||!form.password){showT("❌ Completa todos los campos");return;}if(users.find(u=>u.email===form.email)){showT("❌ Ese correo ya existe");return;}const nu={...form,id:genId(),joinDate:new Date().toLocaleString("es-CL",{month:"long",year:"numeric"}),walletBalance:0,walletPending:[],role:"user",suspended:false};setUsers(p=>[...p,nu]);setMe(nu);setShowAuth(false);setView("home");showT(`🎉 ¡Bienvenida, ${form.nombre.split(" ")[0]}!`);};

",padding:60,color:"rgba(255,255,255,0.25)"}}><div style={{fontSize:48}}>📦</div><div style={{fontSize:16,marginTop:12}}>{isOwn?"¡Publica tu primer artículo!":"Sin publicaciones"}</div></div>}</div>{detail&&<DetailModal product={detail} users={users} reviews={reviews} currentUser={meSync} onClose={()=>setDetail(null)} onChat={openChat} onCart={addCart} inCart={cart.includes(detail?.id)}/>}{showPub&&meSync&&<PublishModal currentUser={meSync} onClose={()=>setShowPub(false)} onPublish={handlePublish}/>}{showCart&&<CartPanel cart={cart} products={products} onClose={()=>setShowCart(false)} onRemove={removeCart} onCheckout={(items,total)=>{setShowCart(false);setPayData({items,total});}}/>}{payData&&<PaymentModal items={payData.items} total={payData.total} onClose={()=>setPayData(null)} onSuccess={()=>handlePaySuccess(payData.items,payData.total)}/>}{reviewData&&<ReviewModal order={reviewData.order} vendedor={reviewData.vendedor} onClose={()=>setReviewData(null)} onSubmit={handleReview}/>}{showWallet&&meSync&&<WalletPanel user={meSync} onClose={()=>setShowWallet(false)}/>}{chatOpen&&meSync&&<ChatPanel currentUser={meSync} users={users} chats={chats} setChats={setChats} onClose={()=>setChatOpen(false)}/>}{showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} onRegister={handleRegister}/>}</div>);

flexWrap:"wrap",alignItems:"center"}}><button onClick={()=>setFCat("all")} style={{padding:"8px 18px",border:`2px solid ${filterCat==="all"?C.red:"rgba(255,255,255,0.12)"}`,background:filterCat==="all"?C.red:"transparent",color:"white",borderRadius:50,cursor:"pointer",fontSize:12,fontWeight:800,fontFamily:"inherit"}}>Todos</button>{CATS.map(c=>(<button key={c.id} onClick={()=>setFCat(filterCat===c.id?"all":c.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 16px",border:`2px solid ${filterCat===c.id?c.color:"rgba(255,255,255,0.12)"}`,background:filterCat===c.id?`${c.color}22`:"transparent",color:filterCat===c.id?c.color:"rgba(255,255,255,0.7)",borderRadius:50,cursor:"pointer",fontWeight:filterCat===c.id?800:500,fontSize:12,fontFamily:"inherit"}}><span style={{fontSize:14}}>{c.emoji}</span>{c.label}</button>))}<div style={{marginLeft:"auto",display:"flex",gap:8}}>{["all","Venta","Donación"].map(t=>(<button key={t} onClick={()=>setFTipo(t)} style={{padding:"7px 14px",border:`2px solid ${filterTipo===t?C.yellow:"rgba(255,255,255,0.12)"}`,background:filterTipo===t?"rgba(245,197,24,0.15)":"transparent",color:filterTipo===t?C.yellow:"rgba(255,255,255,0.5)",borderRadius:50,cursor:"pointer",fontSize:11,fontWeight:800,fontFamily:"inherit"}}>{t==="all"?"Todo":t==="Venta"?"💰 Venta":"🎁 Donación"}</button>))}</div></div><div style={{padding:"4px 22px 12px",fontSize:12,color:"rgba(255,255,255,0.35)",fontWeight:700}}>{filtered.length} artículo{filtered.length!==1?"s":""} encontrado{filtered.length!==1?"s":""}</div><div style={{padding:"4px 22px 80px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:18}}>{filtered.map(p=><PCard key={p.id} product={p} users={users} reviews={reviews} onView={setDetail} onCart={addCart} inCart={cart.includes(p.id)} featured={featuredSellers.has(p.vendedorId)}/>)}{filtered.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:60,color:"rgba(255,255,255,0.25)"}}><div style={{fontSize:48}}>🔍</div><div style={{fontSize:16,marginTop:12,fontWeight:700}}>Sin resultados</div></div>}</div>{meSync&&<button onClick={()=>setShowPub(true)} style={{position:"fixed",bottom:28,right:28,background:C.red,color:"white",border:"none",borderRadius:50,padding:"14px 24px",fontWeight:900,cursor:"pointer",fontSize:15,boxShadow:"0 8px 28px rgba(224,58,47,.55)",zIndex:99,fontFamily:"inherit"}}>+ Publicar</button>}{showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} onRegister={handleRegister}/>}{showPub&&meSync&&<PublishModal currentUser={meSync} onClose={()=>setShowPub(false)} onPublish={handlePublish}/>}{detail&&<DetailModal product={detail} users={users} reviews={reviews} currentUser={meSync} onClose={()=>setDetail(null)} onChat={openChat} onCart={addCart} inCart={cart.includes(detail?.id)}/>}{showCart&&<CartPanel cart={cart} products={products} onClose={()=>setShowCart(false)} onRemove={removeCart} onCheckout={(items,total)=>{setShowCart(false);setPayData({items,total});}}/>}{payData&&<PaymentModal items={payData.items} total={payData.total} onClose={()=>setPayData(null)} onSuccess={()=>handlePaySuccess(payData.items,payData.total)}/>}{reviewData&&<ReviewModal order={reviewData.order} vendedor={reviewData.vendedor} onClose={()=>setReviewData(null)} onSubmit={handleReview}/>}{showWallet&&meSync&&<WalletPanel user={meSync} onClose={()=>setShowWallet(false)}/>}{chatOpen&&meSync&&<ChatPanel currentUser={meSync} users={users} chats={chats} setChats={setChats} onClose={()=>setChatOpen(false)}/>}</div>);
