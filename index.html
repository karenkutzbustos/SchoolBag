<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SchoolBag</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:#1A2340;}
    select option{background:#222B45;color:white;}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const{useState,useRef}=React;
const C={navy:"#1A2340",navy2:"#222B45",red:"#E03A2F",yellow:"#F5C518",blue:"#4AB8D8",green:"#5DBB63",white:"#FFFFFF",gray:"#2D3655",orange:"#F5832A"};

const COLEGIOS=["Colegio Wenlock School","Colegio Bradford School","Colegio Redland School","Colegio Dunalastair"];
const CLUBS=["Club Old Locks","Club Old Brads","Club Old Reds","Club Dunners","Club Deportivo Universidad Catolica","Club Sport Frances","Otro club"];

const CATS=[
  {id:"uniforme",  label:"Uniformes Escolares", emoji:"👕", color:C.yellow, light:"rgba(245,197,24,0.15)"},
  {id:"deportivo", label:"Artículos Deportivos", emoji:"🏃", color:C.blue,   light:"rgba(74,184,216,0.15)"},
  {id:"club",      label:"Uniforme Club",        emoji:"⚽", color:C.green,  light:"rgba(93,187,99,0.15)"},
  {id:"zapatos",   label:"Zapatos",              emoji:"👟", color:C.orange, light:"rgba(245,131,42,0.15)"},
  {id:"libros",    label:"Libros",               emoji:"📚", color:C.blue,   light:"rgba(74,184,216,0.15)"},
  {id:"utiles",    label:"Útiles",               emoji:"✏️", color:C.red,    light:"rgba(224,58,47,0.15)"},
  {id:"disfraz",   label:"Disfraces",            emoji:"🎭", color:"#9B59B6", light:"rgba(155,89,182,0.15)"},
];

const ARTICULOS={
  uniforme:["Camisa","Blusa","Pantalón","Falda","Jumper","Corbata","Sweater / Cardigan","Polar","Blazer"],
  deportivo:["Short deportivo","Camiseta deportiva","Buzo","Polera","Medias deportivas","Polerón","Chaqueta deportiva"],
  club:["Camiseta del club","Short del club","Conjunto completo","Chaqueta del club","Medias del club","Uniforme de fútbol","Uniforme de tenis","Uniforme de natación","Uniforme de polo","Uniforme de golf","Equipamiento completo"],
  zapatos:["Zapatos de colegio","Zapatillas deportivas","Zapatillas de colegio","Zapatos formales","Botines","Zapatillas de fútbol","Zapatillas de tenis","Zapatos de baile","Botas de lluvia"],
  libros:["Libro de Matemáticas","Libro de Lenguaje","Libro de Ciencias","Libro de Historia","Libro de Inglés","Set completo de libros","Diccionario"],
  utiles:["Mochila escolar","Lonchera","Estuche / cartuchera","Kit de geometría","Colores / crayolas","Marcadores","Calculadora","Set de útiles completo"],
  disfraz:["Disfraz de animal","Disfraz de superhéroe","Disfraz histórico","Disfraz de princesa/príncipe","Disfraz de profesión","Disfraz patrio","Disfraz completo con accesorios"],
};

const TALLAS=["Talla 4","Talla 6","Talla 8","Talla 10","Talla 12","Talla 14","Talla 16","XS","S","M","L","XL","No aplica"];
const TALLAS_ZAPATO=["N°28","N°29","N°30","N°31","N°32","N°33","N°34","N°35","N°36","N°37","N°38","N°39","N°40","N°41","N°42","No aplica"];

const ESTADOS=[
  {id:"nuevo",      label:"Nuevo sin uso",               emoji:"✨",color:C.green},
  {id:"como_nuevo", label:"Usado — como nuevo",          emoji:"⭐",color:C.blue},
  {id:"leve",       label:"Usado — signos leves de uso", emoji:"👍",color:C.yellow},
  {id:"prolongado", label:"Usado — uso prolongado",      emoji:"👌",color:C.orange},
];

const AVATARES=[
  {emoji:"👩",label:"Mujer"},{emoji:"👨",label:"Hombre"},{emoji:"👩‍🦱",label:"Mujer rizado"},
  {emoji:"👨‍🦱",label:"Hombre rizado"},{emoji:"👩‍🦰",label:"Mujer pelirroja"},{emoji:"👩‍🦳",label:"Mujer cana"},
  {emoji:"👩‍🦲",label:"Mujer rapada"},{emoji:"🧑",label:"Neutro"},{emoji:"👦",label:"Niño"},
  {emoji:"👧",label:"Niña"},{emoji:"🧒",label:"Niñe"},{emoji:"👱‍♀️",label:"Mujer rubia"},
  {emoji:"👱",label:"Hombre rubio"},{emoji:"🧔",label:"Con barba"},{emoji:"👵",label:"Abuela"},
];

const getEstado=id=>ESTADOS.find(e=>e.id===id)||ESTADOS[1];
const COMM=0.20,WALLET_DAYS=7;
const genId=()=>Math.random().toString(36).slice(2,9);
const fmt=p=>p===0?"Donación 🎁":`$${p.toLocaleString("es-CL")}`;
const getCat=id=>CATS.find(c=>c.id===id)||CATS[0];
const getUser=(id,users)=>users.find(u=>u.id===id);
const sellerScore=(uid,reviews)=>{const r=reviews.filter(r=>r.vendedorId===uid);if(!r.length)return null;return r.reduce((s,x)=>s+x.stars,0)/r.length;};
const scoreBadge=s=>{if(!s)return{label:"Sin calificaciones",color:C.gray};if(s>=4.5)return{label:"⭐ Destacado",color:C.green};if(s>=3.5)return{label:"👍 Buen vendedor",color:C.blue};if(s>=2.5)return{label:"⚠️ En observación",color:C.orange};if(s>=2)return{label:"⚠️ Advertencia",color:C.orange};return{label:"🚫 Suspendido",color:C.red};};

const SEED_USERS=[
  {id:"admin",nombre:"Admin SchoolBag",email:"admin@schoolbag.cl",password:"admin123",avatar:"🛡️",joinDate:"2025",walletBalance:0,walletPending:[],role:"admin",suspended:false}
];

const inp={width:"100%",padding:"12px 16px",borderRadius:14,border:"1.5px solid rgba(255,255,255,0.12)",fontSize:14,boxSizing:"border-box",outline:"none",background:"rgba(255,255,255,0.08)",color:"white",fontFamily:"inherit"};
const lbl={display:"block",fontSize:11,fontWeight:800,color:"rgba(255,255,255,0.55)",textTransform:"uppercase",letterSpacing:1,marginBottom:6};
const btnP=(col=C.red)=>({background:col,color:col===C.yellow||col===C.green?C.navy:"white",border:"none",borderRadius:50,padding:"13px 28px",fontWeight:800,cursor:"pointer",fontSize:15,fontFamily:"inherit"});

function Toast({msg}){return msg?<div style={{position:"fixed",top:22,right:22,background:C.yellow,color:C.navy,padding:"13px 24px",borderRadius:50,fontWeight:800,zIndex:9999,boxShadow:"0 8px 32px rgba(245,197,24,.4)",fontSize:14}}>{msg}</div>:null;}
function Ava({user,size=38}){const cols=[C.red,C.blue,C.green,C.yellow,"#9B59B6"];const i=user?user.id.charCodeAt(1)%cols.length:0;return <div style={{width:size,height:size,borderRadius:"50%",background:cols[i],display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.42,flexShrink:0,border:"2.5px solid rgba(255,255,255,0.2)"}}>{user?.avatar||"👤"}</div>;}
function Overlay({onClose,children,maxW=520}){return(<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(10,15,35,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16,backdropFilter:"blur(6px)"}}><div onClick={e=>e.stopPropagation()} style={{background:C.navy2,borderRadius:28,maxWidth:maxW,width:"100%",maxHeight:"93vh",overflowY:"auto",boxShadow:"0 32px 80px rgba(0,0,0,.6)",border:"1px solid rgba(255,255,255,0.08)"}}>{children}</div></div>);}
function Stars({value,onChange,size=22}){const[hover,setHover]=useState(0);return(<div style={{display:"flex",gap:4}}>{[1,2,3,4,5].map(s=>(<span key={s} onClick={()=>onChange&&onChange(s)} onMouseEnter={()=>onChange&&setHover(s)} onMouseLeave={()=>onChange&&setHover(0)} style={{fontSize:size,cursor:onChange?"pointer":"default",color:(hover||value)>=s?C.yellow:"rgba(255,255,255,0.2)",transition:"color .1s"}}>★</span>))}</div>);}
function ScorePill({score}){if(!score)return <span style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>Sin calificaciones</span>;const b=scoreBadge(score);return <span style={{background:`${b.color}22`,color:b.color,fontSize:12,fontWeight:800,padding:"4px 12px",borderRadius:50,border:`1px solid ${b.color}44`}}>{b.label} ({score.toFixed(1)})</span>;}
function EstadoBadge({estadoId}){const e=getEstado(estadoId);return <span style={{background:`${e.color}22`,color:e.color,fontSize:11,fontWeight:800,padding:"3px 11px",borderRadius:50,border:`1px solid ${e.color}33`}}>{e.emoji} {e.label}</span>;}

// ── AUTH MODAL ─────────────────────────────────────────────────────────────
function AuthModal({onClose,onLogin,onRegister,initTab="register"}){
  const[tab,setTab]=useState(initTab);
  const[form,setForm]=useState({nombre:"",email:"",password:"",avatar:"👩"});
  const[forgot,setForgot]=useState(false);
  const[forgotEmail,setForgotEmail]=useState("");
  const[forgotSent,setForgotSent]=useState(false);
  const[err,setErr]=useState("");
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const doLogin=()=>{setErr("");const ok=onLogin(form.email,form.password);if(!ok)setErr("Correo o contraseña incorrectos");};
  const doRegister=()=>{
    setErr("");
    if(!form.nombre||!form.email||!form.password){setErr("Completa todos los campos");return;}
    if(form.password.length<6){setErr("La contraseña debe tener al menos 6 caracteres");return;}
    const ok=onRegister(form);
    if(!ok)setErr("Ese correo ya está registrado");
  };
  const doForgot=()=>{if(!forgotEmail){setErr("Ingresa tu correo");return;}setForgotSent(true);setErr("");};

  return(
    <Overlay onClose={onClose} maxW={440}>
      <div style={{padding:"28px 28px 20px",textAlign:"center",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
        <div style={{fontSize:48,marginBottom:4}}>🎒</div>
        <h1 style={{margin:"0 0 3px",fontSize:24,fontWeight:900,color:"white"}}>SchoolBag</h1>
        <p style={{color:"rgba(255,255,255,0.4)",fontSize:12,margin:0}}>Conectando familias escolares</p>
      </div>
      <div style={{padding:"20px 28px 28px"}}>
        {!forgot&&(
          <div style={{display:"flex",background:C.gray,borderRadius:50,padding:4,marginBottom:20}}>
            {[["login","Ingresar"],["register","Registrarme"]].map(([t,l])=>(
              <button key={t} onClick={()=>{setTab(t);setErr("");}} style={{flex:1,padding:"9px",border:"none",borderRadius:50,background:tab===t?C.red:"transparent",fontWeight:tab===t?800:400,color:"white",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>
        )}

        {/* FORGOT */}
        {forgot&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <button onClick={()=>{setForgot(false);setForgotSent(false);setErr("");}} style={{background:"none",border:"none",color:C.blue,cursor:"pointer",fontSize:13,textAlign:"left",fontFamily:"inherit"}}>← Volver</button>
            <h3 style={{color:"white",fontWeight:800,fontSize:17,margin:0}}>🔒 Recuperar contraseña</h3>
            {!forgotSent?(
              <>
                <p style={{color:"rgba(255,255,255,0.5)",fontSize:13,margin:0}}>Te enviaremos un link para restablecer tu contraseña.</p>
                <div><label style={lbl}>Tu correo registrado</label><input value={forgotEmail} onChange={e=>setForgotEmail(e.target.value)} placeholder="tucorreo@mail.com" style={inp}/></div>
                {err&&<div style={{background:"rgba(224,58,47,0.15)",borderRadius:12,padding:"10px 14px",fontSize:13,color:C.red}}>{err}</div>}
                <button onClick={doForgot} style={{...btnP(C.red),width:"100%",textAlign:"center"}}>Enviar link de recuperación</button>
              </>
            ):(
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{fontSize:48,marginBottom:12}}>📧</div>
                <h3 style={{color:C.green,fontWeight:900,marginBottom:8}}>¡Correo enviado!</h3>
                <p style={{color:"rgba(255,255,255,0.55)",fontSize:14,lineHeight:1.5}}>Revisa tu bandeja en <strong style={{color:"white"}}>{forgotEmail}</strong></p>
                <button onClick={()=>{setForgot(false);setForgotSent(false);setTab("login");}} style={{...btnP(C.blue),marginTop:20,textAlign:"center"}}>Volver a ingresar</button>
              </div>
            )}
          </div>
        )}

        {/* LOGIN */}
        {!forgot&&tab==="login"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div><label style={lbl}>Correo</label><input value={form.email} onChange={e=>f("email",e.target.value)} placeholder="tucorreo@mail.com" style={inp}/></div>
            <div><label style={lbl}>Contraseña</label><input type="password" value={form.password} onChange={e=>f("password",e.target.value)} placeholder="••••••" style={inp} onKeyDown={e=>e.key==="Enter"&&doLogin()}/></div>
            {err&&<div style={{background:"rgba(224,58,47,0.15)",borderRadius:12,padding:"10px 14px",fontSize:13,color:C.red}}>{err}</div>}
            <button onClick={doLogin} style={{...btnP(C.red),width:"100%",textAlign:"center"}}>Ingresar →</button>
            <button onClick={()=>{setForgot(true);setErr("");}} style={{background:"none",border:"none",color:C.blue,cursor:"pointer",fontSize:13,textDecoration:"underline",fontFamily:"inherit",textAlign:"center"}}>¿Olvidaste tu contraseña?</button>
          </div>
        )}

        {/* REGISTER */}
        {!forgot&&tab==="register"&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <div>
              <label style={lbl}>Elige tu avatar</label>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
                {AVATARES.map(a=>(<button key={a.emoji} onClick={()=>f("avatar",a.emoji)} title={a.label} style={{fontSize:20,background:form.avatar===a.emoji?"rgba(245,197,24,0.2)":"rgba(255,255,255,0.06)",border:`2px solid ${form.avatar===a.emoji?C.yellow:"transparent"}`,borderRadius:10,width:40,height:40,cursor:"pointer"}}>{a.emoji}</button>))}
              </div>
            </div>
            <div><label style={lbl}>Nombre completo</label><input value={form.nombre} onChange={e=>f("nombre",e.target.value)} placeholder="Tu nombre" style={inp}/></div>
            <div><label style={lbl}>Correo</label><input value={form.email} onChange={e=>f("email",e.target.value)} placeholder="tucorreo@mail.com" style={inp}/></div>
            <div><label style={lbl}>Contraseña</label><input type="password" value={form.password} onChange={e=>f("password",e.target.value)} placeholder="Mínimo 6 caracteres" style={inp}/></div>
            {err&&<div style={{background:"rgba(224,58,47,0.15)",borderRadius:12,padding:"10px 14px",fontSize:13,color:C.red}}>{err}</div>}
            <button onClick={doRegister} style={{...btnP(C.red),width:"100%",textAlign:"center"}}>Crear mi cuenta →</button>
          </div>
        )}
      </div>
    </Overlay>
  );
}

// ── EDIT PROFILE MODAL ─────────────────────────────────────────────────────
function EditProfileModal({user,onClose,onSave,onLogout,onDelete}){
  const[tab,setTab]=useState("perfil");
  const[form,setForm]=useState({nombre:user.nombre,avatar:user.avatar,password:"",passwordNew:"",passwordConfirm:""});
  const[confirmDelete,setConfirmDelete]=useState(false);
  const[err,setErr]=useState("");
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const save=()=>{
    setErr("");
    if(!form.nombre.trim()){setErr("El nombre no puede estar vacío");return;}
    if(form.passwordNew){
      if(!form.password){setErr("Ingresa tu contraseña actual");return;}
      if(form.password!==user.password){setErr("Contraseña actual incorrecta");return;}
      if(form.passwordNew.length<6){setErr("La nueva contraseña debe tener al menos 6 caracteres");return;}
      if(form.passwordNew!==form.passwordConfirm){setErr("Las contraseñas no coinciden");return;}
    }
    onSave({...user,nombre:form.nombre,avatar:form.avatar,...(form.passwordNew?{password:form.passwordNew}:{})});
    onClose();
  };

  return(
    <Overlay onClose={onClose} maxW={460}>
      <div style={{padding:"22px 28px 0",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <Ava user={{...user,avatar:form.avatar}} size={52}/>
          <div>
            <div style={{color:"white",fontWeight:900,fontSize:18}}>{form.nombre||user.nombre}</div>
            <div style={{color:"rgba(255,255,255,0.4)",fontSize:12}}>{user.email}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {[["perfil","👤 Perfil"],["password","🔒 Contraseña"],["cuenta","⚙️ Cuenta"]].map(([t,l])=>(
            <button key={t} onClick={()=>{setTab(t);setErr("");}} style={{padding:"8px 14px",border:"none",borderRadius:"12px 12px 0 0",background:tab===t?C.navy:"transparent",color:tab===t?"white":"rgba(255,255,255,0.4)",fontWeight:tab===t?800:600,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"20px 28px 28px",display:"flex",flexDirection:"column",gap:14}}>
        {/* PERFIL */}
        {tab==="perfil"&&(<>
          <div>
            <label style={lbl}>Avatar</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
              {AVATARES.map(a=>(<button key={a.emoji} onClick={()=>f("avatar",a.emoji)} title={a.label} style={{fontSize:20,background:form.avatar===a.emoji?"rgba(245,197,24,0.2)":"rgba(255,255,255,0.06)",border:`2px solid ${form.avatar===a.emoji?C.yellow:"transparent"}`,borderRadius:10,width:40,height:40,cursor:"pointer"}}>{a.emoji}</button>))}
            </div>
          </div>
          <div><label style={lbl}>Nombre completo</label><input value={form.nombre} onChange={e=>f("nombre",e.target.value)} style={inp}/></div>
          {err&&<div style={{background:"rgba(224,58,47,0.15)",borderRadius:12,padding:"10px 14px",fontSize:13,color:C.red}}>{err}</div>}
          <button onClick={save} style={{...btnP(C.red),width:"100%",textAlign:"center"}}>Guardar cambios</button>
        </>)}

        {/* CONTRASEÑA */}
        {tab==="password"&&(<>
          <div><label style={lbl}>Contraseña actual</label><input type="password" value={form.password} onChange={e=>f("password",e.target.value)} placeholder="••••••" style={inp}/></div>
          <div><label style={lbl}>Nueva contraseña</label><input type="password" value={form.passwordNew} onChange={e=>f("passwordNew",e.target.value)} placeholder="Mínimo 6 caracteres" style={inp}/></div>
          <div><label style={lbl}>Confirmar nueva contraseña</label><input type="password" value={form.passwordConfirm} onChange={e=>f("passwordConfirm",e.target.value)} placeholder="Repite la contraseña" style={inp}/></div>
          {err&&<div style={{background:"rgba(224,58,47,0.15)",borderRadius:12,padding:"10px 14px",fontSize:13,color:C.red}}>{err}</div>}
          <button onClick={save} style={{...btnP(C.red),width:"100%",textAlign:"center"}}>Cambiar contraseña</button>
        </>)}

        {/* CUENTA */}
        {tab==="cuenta"&&(<>
          {/* Cerrar sesión */}
          <div style={{background:C.gray,borderRadius:16,padding:"16px 18px"}}>
            <div style={{color:"white",fontWeight:800,fontSize:14,marginBottom:4}}>Cerrar sesión</div>
            <div style={{color:"rgba(255,255,255,0.45)",fontSize:12,marginBottom:12}}>Saldrás de tu cuenta en este dispositivo.</div>
            <button onClick={onLogout} style={{background:C.blue,color:"white",border:"none",borderRadius:50,padding:"10px 22px",fontWeight:800,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Cerrar sesión</button>
          </div>
          {/* Eliminar cuenta */}
          <div style={{background:"rgba(224,58,47,0.1)",border:`1px solid ${C.red}33`,borderRadius:16,padding:"16px 18px"}}>
            <div style={{color:C.red,fontWeight:800,fontSize:14,marginBottom:4}}>Eliminar cuenta</div>
            <div style={{color:"rgba(255,255,255,0.45)",fontSize:12,marginBottom:12}}>Esta acción es permanente y no se puede deshacer. Se eliminarán todos tus datos.</div>
            {!confirmDelete?(
              <button onClick={()=>setConfirmDelete(true)} style={{background:"rgba(224,58,47,0.2)",color:C.red,border:`1.5px solid ${C.red}`,borderRadius:50,padding:"10px 22px",fontWeight:800,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>Eliminar mi cuenta</button>
            ):(
              <div>
                <div style={{color:C.yellow,fontSize:13,fontWeight:700,marginBottom:10}}>⚠️ ¿Estás segura? Esta acción no se puede deshacer.</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setConfirmDelete(false)} style={{padding:"9px 18px",background:C.gray,border:"none",borderRadius:50,cursor:"pointer",fontSize:13,color:"rgba(255,255,255,0.6)",fontFamily:"inherit"}}>Cancelar</button>
                  <button onClick={onDelete} style={{...btnP(C.red),padding:"9px 20px",fontSize:13}}>Sí, eliminar</button>
                </div>
              </div>
            )}
          </div>
        </>)}
      </div>
    </Overlay>
  );
}

// ── PHOTO UPLOADER ─────────────────────────────────────────────────────────
function PhotoUploader({fotos,setFotos}){const ref=useRef();const add=e=>{const files=[...e.target.files];if(fotos.length+files.length>2){alert("Máximo 2 fotos");return;}files.forEach(f=>{const r=new FileReader();r.onload=ev=>setFotos(p=>[...p,ev.target.result]);r.readAsDataURL(f);});};return(<div><label style={lbl}>Fotos (máx. 2) *</label><div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:6}}>{fotos.map((f,i)=>(<div key={i} style={{position:"relative",width:88,height:88}}><img src={f} alt="" style={{width:88,height:88,objectFit:"cover",borderRadius:14,border:"2px solid rgba(255,255,255,0.2)"}}/><button onClick={()=>setFotos(p=>p.filter((_,j)=>j!==i))} style={{position:"absolute",top:-6,right:-6,background:C.red,color:"white",border:"none",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button></div>))}{fotos.length<2&&(<div onClick={()=>ref.current.click()} style={{width:88,height:88,border:`2px dashed ${C.blue}`,borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",background:"rgba(74,184,216,0.1)",color:C.blue,fontSize:11,fontWeight:800,gap:4}}><span style={{fontSize:22}}>📷</span><span>Agregar</span></div>)}</div><input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={add}/><p style={{fontSize:11,color:"rgba(255,255,255,0.3)",margin:"8px 0 0"}}>Revisadas en 24-48h antes de publicarse</p></div>);}

// ── PUBLISH MODAL ──────────────────────────────────────────────────────────

        ):(

        {/* Condición */}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div><label style={lbl}>Talla / Número</label><select value={form.talla} onChange={e=>f("talla",e.target.value)} style={inp}>{tallasActuales.map(t=><option key={t} style={{background:C.navy2}}>{t}</option>)}</select></div>

  );

  const[toast,setToast]=useState(null);
  const[search,setSearch]=useState("");
  const[searchCol,setSearchCol]=useState("");
  const[searchClub,setSearchClub]=useState("");
  const[filterCat,setFCat]=useState("all");
  const[filterTipo,setFTipo]=useState("all");

  const showT=m=>{setToast(m);setTimeout(()=>setToast(null),3200);};
  const addCart=p=>{if(cart.includes(p.id)){showT("Ya está en tu SchoolBag");return;}setCart(c=>[...c,p.id]);showT("🛍️ Agregado a tu SchoolBag");};
  const removeCart=id=>setCart(c=>c.filter(x=>x!==id));
  const openChat=seller=>{if(!me){setShowAuth(true);return;}const k=[me.id,seller.id].sort().join("-");if(!chats[k])setChats(p=>({...p,[k]:[]}));setChatOpen(true);};

  const handleLogin=(email,pw)=>{
    const u=users.find(u=>u.email===email&&u.password===pw);
    if(!u||u.suspended)return false;
    setMe(u);setShowAuth(false);
    if(u.role==="admin")setShowAdmin(true);
    else{setView("home");showT(`✅ ¡Bienvenida, ${u.nombre.split(" ")[0]}!`);}
    return true;
  };

  const handleRegister=form=>{
    if(!form.nombre||!form.email||!form.password)return false;
    if(users.find(u=>u.email===form.email))return false;
    const nu={...form,id:genId(),joinDate:new Date().toLocaleString("es-CL",{month:"long",year:"numeric"}),walletBalance:0,walletPending:[],role:"user",suspended:false};
    setUsers(p=>[...p,nu]);setMe(nu);setShowAuth(false);setView("home");
    showT(`🎉 ¡Bienvenida, ${form.nombre.split(" ")[0]}!`);
    return true;
  };

  const handleSaveProfile=updated=>{
    setUsers(p=>p.map(u=>u.id===updated.id?updated:u));
    setMe(updated);
    showT("✅ Perfil actualizado");
  };

  const handleLogout=()=>{
    setMe(null);setView("landing");setCart([]);
    setShowEditProfile(false);setChatOpen(false);
    showT("👋 Sesión cerrada");
  };

  const handleDeleteAccount=()=>{
    setUsers(p=>p.filter(u=>u.id!==me.id));
    setProducts(p=>p.filter(p=>p.vendedorId!==me.id));
    setMe(null);setView("landing");setCart([]);
    setShowEditProfile(false);
    showT("Cuenta eliminada");
  };

  const handlePublish=(form,fotos)=>{
    const np={
      ...form,id:genId(),vendedorId:me.id,
      precio:form.tipo==="Donación"?0:Number(form.precio),
      colegio:form.categoria==="club"?"":form.colegio,
      club:form.categoria==="club"?form.club:"",
      fotos,status:"pending",fecha:new Date().toISOString().slice(0,10)
    };
    setProducts(p=>[np,...p]);setShowPub(false);
    showT("📋 Publicación enviada — revisamos en 24-48h");
  };

  const handlePaySuccess=(items,total)=>{
    const newOrders=items.map(p=>({id:genId(),compradorId:me.id,vendedorId:p.vendedorId,productId:p.id,monto:p.precio,fecha:new Date().toISOString().slice(0,10),reviewed:false}));
    setOrders(prev=>[...prev,...newOrders]);
    const releaseDate=new Date(Date.now()+WALLET_DAYS*86400000).toISOString().slice(0,10);
    setUsers(prev=>prev.map(u=>{const si=items.filter(p=>p.vendedorId===u.id);if(!si.length)return u;const amount=Math.round(si.reduce((s,p)=>s+p.precio,0)*(1-COMM));return{...u,walletPending:[...(u.walletPending||[]),{amount,releaseDate,orderId:newOrders.find(o=>o.vendedorId===u.id)?.id||""}]};}));
    setCart([]);setPayData(null);
    if(newOrders.length===1){const vendedor=getUser(newOrders[0].vendedorId,users);setTimeout(()=>setReviewData({order:newOrders[0],vendedor}),600);}
    showT("🎉 ¡Compra exitosa!");
  };

  const handleReview=(stars,comment)=>{
    const{order,vendedor}=reviewData;
    const newR={id:genId(),vendedorId:order.vendedorId,compradorId:me.id,orderId:order.id,stars,comment,fecha:new Date().toISOString().slice(0,10)};
    setReviews(p=>[...p,newR]);setOrders(p=>p.map(o=>o.id===order.id?{...o,reviewed:true}:o));
    if(stars===1)showT("⚠️ Ticket de soporte creado.");else if(stars===2)showT("⚠️ Advertencia enviada.");else showT("⭐ ¡Gracias por calificar!");
    setReviewData(null);
  };

  const meSync=me?users.find(u=>u.id===me.id)||me:null;
  const visibleProducts=products.filter(p=>p.status==="approved"||(meSync&&p.vendedorId===meSync.id));
  const featuredSellers=new Set(users.filter(u=>{const s=sellerScore(u.id,reviews);return s&&s>=4.5;}).map(u=>u.id));
  const filtered=visibleProducts.filter(p=>{
    const mS=!search||p.articulo.toLowerCase().includes(search.toLowerCase())||p.descripcion.toLowerCase().includes(search.toLowerCase());
    const mC=!searchCol||p.colegio?.toLowerCase().includes(searchCol.toLowerCase());
    const mCl=!searchClub||(p.club&&p.club.toLowerCase().includes(searchClub.toLowerCase()));
    return mS&&(searchClub?mCl:mC)&&(filterCat==="all"||p.categoria===filterCat)&&(filterTipo==="all"||p.tipo===filterTipo);
  }).sort((a,b)=>(featuredSellers.has(b.vendedorId)?1:0)-(featuredSellers.has(a.vendedorId)?1:0));

  const openAuth=(t)=>{setAuthTab(t||"register");setShowAuth(true);};

  // ADMIN
  if(showAdmin&&meSync?.role==="admin")return(<><Toast msg={toast}/><AdminPanel products={products} setProducts={setProducts} users={users} setUsers={setUsers} reviews={reviews} onClose={()=>{setShowAdmin(false);setView("home");}}/></>);

  // LANDING
  if(view==="landing")return(<><Toast msg={toast}/><Landing onExplore={()=>setView("home")} onAuth={t=>openAuth(t)}/>{showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} onRegister={handleRegister} initTab={authTab}/>}</>);

  // PROFILE
  if((view==="seller"&&sellerU)||(view==="myprofile"&&meSync)){
    const pU=view==="myprofile"?meSync:sellerU;
    const mine=products.filter(p=>p.vendedorId===pU.id);
    const isOwn=meSync?.id===pU.id;
    const score=sellerScore(pU.id,reviews);
    const pRevs=reviews.filter(r=>r.vendedorId===pU.id);
    const reviewableOrders=orders.filter(o=>o.compradorId===meSync?.id&&o.vendedorId===pU.id&&!o.reviewed);
    return(<div style={{background:C.navy,minHeight:"100vh"}}><Toast msg={toast}/>
      <Nav me={meSync} cart={cart} onHome={()=>setView("home")} onProfile={()=>setView("myprofile")} onCart={()=>setShowCart(true)} onChat={()=>setChatOpen(!chatOpen)} onPub={()=>{if(!meSync){openAuth("register");return;}setShowPub(true);}} onAuth={()=>openAuth("login")} onAdmin={()=>setShowAdmin(true)} onWallet={()=>setShowWallet(true)} chatOpen={chatOpen}/>
      <div style={{background:`linear-gradient(180deg,${C.navy2},${C.navy})`,padding:"22px 26px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
        <button onClick={()=>setView("home")} style={{background:C.gray,border:"none",color:"rgba(255,255,255,0.65)",padding:"6px 15px",borderRadius:50,cursor:"pointer",fontSize:12,marginBottom:18,fontFamily:"inherit"}}>← Volver</button>
        <div style={{display:"flex",gap:16,alignItems:"flex-start",paddingBottom:18}}>
          <Ava user={pU} size={66}/>
          <div style={{flex:1}}>
            <h2 style={{color:"white",margin:"0 0 3px",fontSize:21,fontWeight:900}}>{pU.nombre}</h2>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginBottom:6}}>{pU.email}</div>
            <ScorePill score={score}/>
          </div>
          {isOwn&&(
            <div style={{display:"flex",gap:7}}>
              <button onClick={()=>setShowEditProfile(true)} style={{background:C.gray,border:"1px solid rgba(255,255,255,0.12)",color:"white",borderRadius:50,padding:"8px 16px",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"}}>✏️ Editar</button>
              <button onClick={()=>setShowPub(true)} style={{...btnP(C.red),fontSize:12,padding:"8px 16px"}}>+ Publicar</button>
            </div>
          )}
        </div>
        {!isOwn&&reviewableOrders.length>0&&(<div style={{background:`${C.yellow}18`,border:`1px solid ${C.yellow}44`,borderRadius:14,padding:"11px 14px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:13,color:C.yellow,fontWeight:700}}>⭐ Tienes una compra pendiente de calificar</span><button onClick={()=>setReviewData({order:reviewableOrders[0],vendedor:pU})} style={{...btnP(C.yellow),fontSize:11,padding:"7px 14px"}}>Calificar</button></div>)}
        {pRevs.length>0&&(<div style={{paddingBottom:14,borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:12}}>{pRevs.slice(-3).reverse().map(r=>{const comp=getUser(r.compradorId,users);return(<div key={r.id} style={{display:"flex",gap:9,marginBottom:9,background:C.gray,borderRadius:13,padding:"9px 13px"}}><Ava user={comp} size={28}/><div style={{flex:1}}><div style={{display:"flex",gap:7,alignItems:"center",marginBottom:2}}><Stars value={r.stars} size={12}/><span style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>{comp?.nombre.split(" ")[0]} · {r.fecha}</span></div>{r.comment&&<div style={{fontSize:12,color:"rgba(255,255,255,0.55)",lineHeight:1.4}}>{r.comment}</div>}</div></div>);})}</div>)}
        <div style={{display:"flex",gap:26,paddingBottom:13,borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:12}}>{[[C.yellow,"📦",mine.length,"artículos"],[C.green,"✅",mine.filter(p=>p.status==="approved").length,"aprobados"],[C.blue,"⏳",mine.filter(p=>p.status==="pending").length,"en revisión"]].map(([col,ic,v,lb])=>(<div key={lb}><div style={{fontSize:14,color:"white"}}>{ic} <strong style={{color:col}}>{v}</strong></div><div style={{fontSize:10,color:"rgba(255,255,255,0.32)"}}>{lb}</div></div>))}</div>
      </div>
      <div style={{padding:"18px 26px 60px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:15}}>
        {mine.map(p=>(<div key={p.id} style={{position:"relative"}}><PCard product={p} users={[pU]} reviews={reviews} onView={setDetail} onCart={addCart} inCart={cart.includes(p.id)} featured={featuredSellers.has(p.vendedorId)}/>{p.status==="pending"&&<div style={{position:"absolute",top:9,right:9,background:C.yellow,color:C.navy,fontSize:10,fontWeight:800,padding:"2px 9px",borderRadius:50}}>⏳ Revisión</div>}{p.status==="rejected"&&<div style={{position:"absolute",top:9,right:9,background:C.red,color:"white",fontSize:10,fontWeight:800,padding:"2px 9px",borderRadius:50}}>❌ Rechazada</div>}</div>))}
        {mine.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:55,color:"rgba(255,255,255,0.22)"}}><div style={{fontSize:45}}>📦</div><div style={{fontSize:15,marginTop:11}}>{isOwn?"¡Publica tu primer artículo!":"Sin publicaciones"}</div></div>}
      </div>
      {showEditProfile&&meSync&&<EditProfileModal user={meSync} onClose={()=>setShowEditProfile(false)} onSave={handleSaveProfile} onLogout={handleLogout} onDelete={handleDeleteAccount}/>}
      {detail&&<DetailModal product={detail} users={users} reviews={reviews} currentUser={meSync} onClose={()=>setDetail(null)} onChat={openChat} onCart={addCart} inCart={cart.includes(detail?.id)}/>}
      {showPub&&meSync&&<PublishModal currentUser={meSync} onClose={()=>setShowPub(false)} onPublish={handlePublish}/>}
      {showCart&&<CartPanel cart={cart} products={products} onClose={()=>setShowCart(false)} onRemove={removeCart} onCheckout={(items,total)=>{setShowCart(false);setPayData({items,total});}}/>}
      {payData&&<PaymentModal items={payData.items} total={payData.total} onClose={()=>setPayData(null)} onSuccess={()=>handlePaySuccess(payData.items,payData.total)}/>}
      {reviewData&&<ReviewModal order={reviewData.order} vendedor={reviewData.vendedor} onClose={()=>setReviewData(null)} onSubmit={handleReview}/>}
      {showWallet&&meSync&&<WalletPanel user={meSync} onClose={()=>setShowWallet(false)}/>}
      {chatOpen&&meSync&&<ChatPanel currentUser={meSync} users={users} chats={chats} setChats={setChats} onClose={()=>setChatOpen(false)}/>}
      {showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} onRegister={handleRegister} initTab={authTab}/>}
    </div>);
  }

  // HOME
  return(<div style={{background:C.navy,minHeight:"100vh"}}><Toast msg={toast}/>
    <Nav me={meSync} cart={cart} onHome={()=>setView("landing")} onProfile={()=>setView("myprofile")} onCart={()=>setShowCart(true)} onChat={()=>setChatOpen(!chatOpen)} onPub={()=>{if(!meSync){openAuth("register");return;}setShowPub(true);}} onAuth={()=>openAuth("login")} onAdmin={()=>setShowAdmin(true)} onWallet={()=>setShowWallet(true)} chatOpen={chatOpen}/>

    {/* SEARCH */}
    <div style={{background:`linear-gradient(180deg,${C.navy2},${C.navy})`,padding:"22px 22px 18px",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
      <h2 style={{color:"white",fontSize:17,fontWeight:900,margin:"0 0 13px",textAlign:"center"}}>Encuentra artículos en tu <span style={{color:C.yellow}}>comunidad</span></h2>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9,maxWidth:840,margin:"0 auto"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar..." style={{...inp,background:"rgba(255,255,255,0.08)"}}/>
        <select value={searchCol} onChange={e=>{setSearchCol(e.target.value);setSearchClub("");}} style={{...inp,cursor:"pointer"}}>
          <option value="" style={{background:C.navy2}}>🏫 Colegio</option>
          {COLEGIOS.map(c=><option key={c} style={{background:C.navy2}}>{c}</option>)}
        </select>
        <select value={searchClub} onChange={e=>{setSearchClub(e.target.value);setSearchCol("");}} style={{...inp,cursor:"pointer"}}>
          <option value="" style={{background:C.navy2}}>⚽ Club deportivo</option>
          {CLUBS.map(c=><option key={c} style={{background:C.navy2}}>{c}</option>)}
        </select>
      </div>
    </div>

    {/* STATS */}
    <div style={{background:C.navy2,padding:"11px 22px",display:"flex",justifyContent:"center",gap:26,borderBottom:"1px solid rgba(255,255,255,0.07)",flexWrap:"wrap"}}>
      {[[C.yellow,"📦",visibleProducts.filter(p=>p.status==="approved").length,"artículos"],[C.blue,"👥",users.filter(u=>u.role!=="admin").length,"vendedores"],[C.green,"🎁",products.filter(p=>p.tipo==="Donación"&&p.status==="approved").length,"donaciones"],[C.yellow,"⭐",reviews.length,"calificaciones"]].map(([col,ic,v,lb])=>(<div key={lb} style={{textAlign:"center"}}><div style={{fontSize:13,fontWeight:900,color:col}}>{ic} {v}</div><div style={{fontSize:10,color:"rgba(255,255,255,0.32)"}}>{lb}</div></div>))}
    </div>

    {/* FILTERS */}
    <div style={{padding:"12px 20px 7px",display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
      <button onClick={()=>setFCat("all")} style={{padding:"6px 14px",border:`2px solid ${filterCat==="all"?C.red:"rgba(255,255,255,0.12)"}`,background:filterCat==="all"?C.red:"transparent",color:"white",borderRadius:50,cursor:"pointer",fontSize:11,fontWeight:800,fontFamily:"inherit"}}>Todos</button>
      {CATS.map(c=>(<button key={c.id} onClick={()=>setFCat(filterCat===c.id?"all":c.id)} style={{display:"flex",alignItems:"center",gap:5,padding:"6px 12px",border:`2px solid ${filterCat===c.id?c.color:"rgba(255,255,255,0.12)"}`,background:filterCat===c.id?`${c.color}22`:"transparent",color:filterCat===c.id?c.color:"rgba(255,255,255,0.65)",borderRadius:50,cursor:"pointer",fontWeight:filterCat===c.id?800:500,fontSize:11,fontFamily:"inherit"}}><span style={{fontSize:12}}>{c.emoji}</span>{c.label}</button>))}
      <div style={{marginLeft:"auto",display:"flex",gap:6}}>
        {["all","Venta","Donación"].map(t=>(<button key={t} onClick={()=>setFTipo(t)} style={{padding:"5px 11px",border:`2px solid ${filterTipo===t?C.yellow:"rgba(255,255,255,0.12)"}`,background:filterTipo===t?"rgba(245,197,24,0.15)":"transparent",color:filterTipo===t?C.yellow:"rgba(255,255,255,0.45)",borderRadius:50,cursor:"pointer",fontSize:11,fontWeight:800,fontFamily:"inherit"}}>{t==="all"?"Todo":t==="Venta"?"💰":"🎁"}</button>))}
      </div>
    </div>
    <div style={{padding:"3px 20px 9px",fontSize:11,color:"rgba(255,255,255,0.32)",fontWeight:700}}>{filtered.length} artículo{filtered.length!==1?"s":""} encontrado{filtered.length!==1?"s":""}</div>

    {/* GRID */}
    <div style={{padding:"3px 20px 80px"}}>
      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"55px 18px",color:"rgba(255,255,255,0.22)"}}>
          <div style={{fontSize:60,marginBottom:14}}>🎒</div>
          <div style={{fontSize:19,fontWeight:800,color:"rgba(255,255,255,0.38)",marginBottom:7}}>¡Sé la primera en publicar!</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.22)",marginBottom:22}}>Aún no hay artículos. Publica el primero y empieza la comunidad.</div>
          {meSync&&<button onClick={()=>setShowPub(true)} style={{...btnP(C.red),fontSize:14,padding:"13px 30px"}}>+ Publicar mi primer artículo</button>}
          {!meSync&&<button onClick={()=>openAuth("register")} style={{...btnP(C.yellow),fontSize:14,padding:"13px 30px"}}>Únete y publica →</button>}
        </div>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(210px,1fr))",gap:16}}>
          {filtered.map(p=><PCard key={p.id} product={p} users={users} reviews={reviews} onView={setDetail} onCart={addCart} inCart={cart.includes(p.id)} featured={featuredSellers.has(p.vendedorId)}/>)}
        </div>
      )}
    </div>

    {meSync&&<button onClick={()=>setShowPub(true)} style={{position:"fixed",bottom:26,right:26,background:C.red,color:"white",border:"none",borderRadius:50,padding:"13px 22px",fontWeight:900,cursor:"pointer",fontSize:14,boxShadow:"0 8px 28px rgba(224,58,47,.55)",zIndex:99,fontFamily:"inherit"}}>+ Publicar</button>}

    {showAuth&&<AuthModal onClose={()=>setShowAuth(false)} onLogin={handleLogin} onRegister={handleRegister} initTab={authTab}/>}
    {showPub&&meSync&&<PublishModal currentUser={meSync} onClose={()=>setShowPub(false)} onPublish={handlePublish}/>}
    {detail&&<DetailModal product={detail} users={users} reviews={reviews} currentUser={meSync} onClose={()=>setDetail(null)} onChat={openChat} onCart={addCart} inCart={cart.includes(detail?.id)}/>}
    {showCart&&<CartPanel cart={cart} products={products} onClose={()=>setShowCart(false)} onRemove={removeCart} onCheckout={(items,total)=>{setShowCart(false);setPayData({items,total});}}/>}
    {payData&&<PaymentModal items={payData.items} total={payData.total} onClose={()=>setPayData(null)} onSuccess={()=>handlePaySuccess(payData.items,payData.total)}/>}
    {reviewData&&<ReviewModal order={reviewData.order} vendedor={reviewData.vendedor} onClose={()=>setReviewData(null)} onSubmit={handleReview}/>}
    {showWallet&&meSync&&<WalletPanel user={meSync} onClose={()=>setShowWallet(false)}/>}
    {chatOpen&&meSync&&<ChatPanel currentUser={meSync} users={users} chats={chats} setChats={setChats} onClose={()=>setChatOpen(false)}/>}
    {showEditProfile&&meSync&&<EditProfileModal user={meSync} onClose={()=>setShowEditProfile(false)} onSave={handleSaveProfile} onLogout={handleLogout} onDelete={handleDeleteAccount}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<SchoolBag/>);
  </script>
</body>
</html>
